<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Project</title>

<!-- ================= CSS ================= -->
<style>

/* Result
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;
}

body {
  font-family: Arial, sans-serif;
  color: white;
}

/* =========================
   SCREENS
========================= */

.screen {
  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  background: #000;

  opacity: 0;
  visibility: hidden;

  transition:
    opacity 1.2s ease,
    visibility 1.2s ease;

  overflow: hidden;
}

.screen.active {
  opacity: 1;
  visibility: visible;
}

/* =========================
   SCREEN 1
========================= */

#screen1 {
  background: #000;
}

#heartCanvas {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;
}

.openingText {
  position: absolute;

  left: 50%;
  bottom: 21%;

  transform: translateX(-50%);

  color: #6FAF78;

  font-size: 18px;

  white-space: nowrap;

  text-align: center;

  opacity: 0;

  animation:
    openingTextAppear 2s ease forwards;

  animation-delay: 3s;
}

.openButton {
  position: absolute;

  left: 50%;
  bottom: 11%;

  transform: translateX(-50%);

  padding: 12px 28px;

  border: none;

  border-radius: 25px;

  background: #2E6B3F;

  color: white;

  font-size: 15px;

  cursor: pointer;

  opacity: 0;

  animation:
    buttonAppear 1.5s ease forwards;

  animation-delay: 4s;

  box-shadow:
    0 0 15px rgba(46, 107, 63, 0.35);
}

.openButton:active {
  transform:
    translateX(-50%)
    scale(0.96);
}

@keyframes openingTextAppear {
  from {
    opacity: 0;
    transform:
      translateX(-50%)
      translateY(10px);
  }

  to {
    opacity: 1;
    transform:
      translateX(-50%)
      translateY(0);
  }
}

@keyframes buttonAppear {
  from {
    opacity: 0;
    transform:
      translateX(-50%)
      translateY(10px);
  }

  to {
    opacity: 1;
    transform:
      translateX(-50%)
      translateY(0);
  }
}

/* =========================
   SCREEN 2
========================= */

#screen2 {
  background: #000;
}

.birthdayGlow {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 700px;
  height: 480px;

  transform:
    translate(-50%, -50%);

  background:
    radial-gradient(
      ellipse,
      rgba(111, 175, 120, 0.34) 0%,
      rgba(111, 175, 120, 0.18) 32%,
      rgba(111, 175, 120, 0.07) 55%,
      transparent 75%
    );

  filter: blur(22px);

  opacity: 0;

  transition:
    opacity 2.5s ease;
}

#screen2.active .birthdayGlow {
  opacity: 1;
}

#particles2 {
  position: absolute;

  inset: 0;

  pointer-events: none;
}

.particle2 {
  position: absolute;

  width: 2px;
  height: 2px;

  border-radius: 50%;

  background:
    rgba(111, 175, 120, 0.55);

  box-shadow:
    0 0 9px rgba(111, 175, 120, 0.45);

  animation:
    floatParticle linear infinite;
}

@keyframes floatParticle {
  from {
    transform:
      translateY(20px);

    opacity: 0;
  }

  15% {
    opacity: 0.85;
  }

  80% {
    opacity: 0.45;
  }

  to {
    transform:
      translateY(-120px);

    opacity: 0;
  }
}

.birthdayContent {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  width: 100%;

  text-align: center;
}

.birthdayTitle {
  display: flex;

  justify-content: center;
  align-items: center;

  gap: 14px;

  margin: 0;

  color: #6FAF78;

  font-size:
    clamp(30px, 7vw, 54px);

  font-weight: bold;

  opacity: 0;

  animation:
    birthdayTitleAppear 1.7s ease forwards;

  animation-delay: 1s;

  text-shadow:
    0 0 20px rgba(111, 175, 120, 0.35),
    0 0 40px rgba(111, 175, 120, 0.15);
}

.cake {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  line-height: 1;

  flex-shrink: 0;
}

.birthdaySubtitle {
  margin-top: 16px;

  color: #6FAF78;

  font-size: 17px;

  opacity: 0;

  animation:
    birthdaySubtitleAppear 1.5s ease forwards;

  animation-delay: 2s;

  text-shadow:
    0 0 12px rgba(111, 175, 120, 0.25);
}

.continue2 {
  margin-top: 35px;

  padding: 11px 27px;

  border: none;

  border-radius: 24px;

  background: #2E6B3F;

  color: white;

  font-size: 14px;

  cursor: pointer;

  opacity: 0;

  animation:
    continue2Appear 1.5s ease forwards;

  animation-delay: 3.2s;

  box-shadow:
    0 0 18px rgba(46, 107, 63, 0.45);
}

.continue2:active {
  transform: scale(0.96);
}

@keyframes birthdayTitleAppear {
  from {
    opacity: 0;

    transform:
      translateY(18px)
      scale(0.96);
  }

  to {
    opacity: 1;

    transform:
      translateY(0)
      scale(1);
  }
}

@keyframes birthdaySubtitleAppear {
  from {
    opacity: 0;

    transform:
      translateY(10px);
  }

  to {
    opacity: 1;

    transform:
      translateY(0);
  }
}

@keyframes continue2Appear {
  from {
    opacity: 0;

    transform:
      translateY(10px);
  }

  to {
    opacity: 1;

    transform:
      translateY(0);
  }
}

/* =========================
   SCREEN 3
========================= */

#screen3 {
  background: #000;
}

#atmosphere3 {
  position: absolute;

  inset: 0;

  pointer-events: none;

  opacity: 0;

  transition:
    opacity 3s ease;

  overflow: hidden;
}

#screen3.active #atmosphere3 {
  opacity: 1;
}

.vine {
  position: absolute;

  pointer-events: none;

  opacity: 0.48;

  animation:
    vineBreathe 8s ease-in-out infinite;
}

.vineLeft {
  width: 360px;
  height: 100%;

  left: -45px;
  top: 0;
}

.vineRight {
  width: 360px;
  height: 100%;

  right: -45px;
  top: 0;

  transform: scaleX(-1);
}

.vineTop {
  width: min(650px, 100vw);
  height: 300px;

  top: -25px;
  left: 50%;

  transform:
    translateX(-50%)
    rotate(2deg);

  animation:
    topBreathe 8s ease-in-out infinite;
}

.vineBottom {
  width: min(650px, 100vw);
  height: 300px;

  bottom: -25px;
  left: 50%;

  transform:
    translateX(-50%)
    rotate(182deg);

  animation:
    bottomBreathe 8s ease-in-out infinite;
}

.vine svg {
  width: 100%;
  height: 100%;
}

.vinePath {
  fill: none;

  stroke:
    rgba(111, 175, 120, 0.60);

  stroke-width: 2;

  stroke-linecap: round;

  filter:
    drop-shadow(
      0 0 6px rgba(111, 175, 120, 0.22)
    );
}

.leaf {
  fill:
    rgba(111, 175, 120, 0.43);

  filter:
    drop-shadow(
      0 0 6px rgba(111, 175, 120, 0.18)
    );
}

@keyframes vineBreathe {
  0%,
  100% {
    transform:
      translateX(0)
      translateY(0)
      scaleY(1);
  }

  50% {
    transform:
      translateX(4px)
      translateY(-3px)
      scaleY(1.018);
  }
}

@keyframes vineBreatheRight {
  0%,
  100% {
    transform:
      scaleX(-1)
      translateX(0)
      translateY(0)
      scaleY(1);
  }

  50% {
    transform:
      scaleX(-1)
      translateX(4px)
      translateY(-3px)
      scaleY(1.018);
  }
}

.vineRight {
  animation:
    vineBreatheRight 8s ease-in-out infinite;
}

@keyframes topBreathe {
  0%,
  100% {
    transform:
      translateX(-50%)
      rotate(2deg)
      translateY(0);
  }

  50% {
    transform:
      translateX(-50%)
      rotate(2deg)
      translateY(4px);
  }
}

@keyframes bottomBreathe {
  0%,
  100% {
    transform:
      translateX(-50%)
      rotate(182deg)
      translateY(0);
  }

  50% {
    transform:
      translateX(-50%)
      rotate(182deg)
      translateY(-4px);
  }
}

.windParticle {
  position: absolute;

  width: 2px;
  height: 2px;

  border-radius: 50%;

  background:
    rgba(111, 175, 120, 0.48);

  box-shadow:
    0 0 8px rgba(111, 175, 120, 0.30);

  animation:
    windFloat linear infinite;
}

@keyframes windFloat {
  0% {
    transform:
      translate3d(-30px, 20px, 0);

    opacity: 0;
  }

  15% {
    opacity: 0.75;
  }

  70% {
    opacity: 0.40;
  }

  100% {
    transform:
      translate3d(80px, -130px, 0);

    opacity: 0;
  }
}

.windStreak {
  position: absolute;

  height: 1px;

  width: 55px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(111, 175, 120, 0.30),
      transparent
    );

  transform: rotate(-12deg);

  animation:
    streakMove linear infinite;

  opacity: 0;
}

@keyframes streakMove {
  0% {
    transform:
      translateX(-80px)
      translateY(30px)
      rotate(-12deg);

    opacity: 0;
  }

  20% {
    opacity: 0.40;
  }

  80% {
    opacity: 0.20;
  }

  100% {
    transform:
      translateX(150px)
      translateY(-60px)
      rotate(-12deg);

    opacity: 0;
  }
}

.letterContainer {
  position: absolute;

  inset: 0;

  width: min(760px, 86%);

  margin: auto;

  padding:
    9vh
    0
    10vh;

  overflow-y: auto;

  scrollbar-width: none;

  text-align: left;

  opacity: 0;

  transform:
    translateY(10px);

  transition:
    opacity 2s ease,
    transform 2s ease;
}

#screen3.active .letterContainer {
  opacity: 1;

  transform:
    translateY(0);

  transition-delay: 2.5s;
}

.letterContainer::-webkit-scrollbar {
  display: none;
}

.letterIntro {
  font-family:
    "Times New Roman",
    serif;

  color: white;

  font-size: 28px;

  margin-bottom: 28px;

  opacity: 0;

  animation:
    introAppear 1.5s ease forwards;

  animation-delay: 3s;
}

.letterText {
  font-family:
    "Times New Roman",
    serif;

  color:
    rgba(255, 255, 255, 0.95);

  font-size: 18px;

  line-height: 1.75;

  letter-spacing: 0.15px;
}

.letterParagraph {
  margin:
    0 0 25px 0;
}

.word {
  opacity: 0;

  transition:
    opacity 0.25s ease;
}

.word.visible {
  opacity: 1;
}

.continue3 {
  display: block;

  margin:
    40px auto 0;

  padding:
    11px 27px;

  border: none;

  border-radius: 24px;

  background: #2E6B3F;

  color: white;

  font-size: 14px;

  cursor: pointer;

  opacity: 0;

  transition:
    opacity 1.5s ease;

  box-shadow:
    0 0 16px rgba(46, 107, 63, 0.30);
}

.continue3.show {
  opacity: 1;
}

@keyframes introAppear {
  from {
    opacity: 0;

    transform:
      translateY(10px);
  }

  to {
    opacity: 1;

    transform:
      translateY(0);
  }
}

/* =====================================================
   SCREEN 4 — ARCHIVE
===================================================== */

#screen4 {
  background: #000;

  overflow: hidden;
}

.archiveAtmosphere {
  position: absolute;

  inset: 0;

  pointer-events: none;

  overflow: hidden;

  opacity: 0;

  transition:
    opacity 3s ease;
}

#screen4.active .archiveAtmosphere {
  opacity: 1;
}

.archiveAtmosphere span {
  position: absolute;

  color:
    rgba(111, 175, 120, 0.35);

  font-size: 10px;

  animation:
    archiveSparkle 5s ease-in-out infinite;
}

.archiveAtmosphere span:nth-child(1) {
  left: 12%;
  top: 20%;
}

.archiveAtmosphere span:nth-child(2) {
  left: 80%;
  top: 17%;

  animation-delay: 1s;
}

.archiveAtmosphere span:nth-child(3) {
  left: 22%;
  top: 75%;

  animation-delay: 2s;
}

.archiveAtmosphere span:nth-child(4) {
  left: 87%;
  top: 68%;

  animation-delay: 1.5s;
}

.archiveAtmosphere span:nth-child(5) {
  left: 50%;
  top: 12%;

  animation-delay: 2.5s;
}

.archiveAtmosphere span:nth-child(6) {
  left: 7%;
  top: 52%;

  animation-delay: 3s;
}

.archiveAtmosphere span:nth-child(7) {
  left: 72%;
  top: 87%;

  animation-delay: 0.8s;
}

.archiveAtmosphere span:nth-child(8) {
  left: 38%;
  top: 91%;

  animation-delay: 1.8s;
}

@keyframes archiveSparkle {
  0%,
  100% {
    opacity: 0.15;

    transform:
      scale(0.8);
  }

  50% {
    opacity: 0.65;

    transform:
      scale(1.25);
  }
}

.archiveIntro {
  position: absolute;

  left: 50%;
  top: 50%;

  width: min(850px, 88%);

  transform:
    translate(-50%, -50%);

  text-align: center;

  opacity: 0;

  transition:
    opacity 1.5s ease;
}

#screen4.active .archiveIntro {
  opacity: 1;
}

.archiveWord {
  color: #6FAF78;

  font-size:
    clamp(48px, 13vw, 92px);

  font-weight: 300;

  letter-spacing:
    0.28em;

  margin-right:
    -0.28em;

  opacity: 0;

  transform:
    scale(0.72);

  text-shadow:
    0 0 18px rgba(111, 175, 120, 0.22),
    0 0 45px rgba(111, 175, 120, 0.10);

  animation:
    archiveTitleReveal 2.2s ease forwards;

  animation-delay: 0.7s;
}

@keyframes archiveTitleReveal {
  0% {
    opacity: 0;

    transform:
      scale(0.72);

    letter-spacing:
      0.5em;
  }

  60% {
    opacity: 1;
  }

  100% {
    opacity: 1;

    transform:
      scale(1);

    letter-spacing:
      0.28em;
  }
}

.archiveSubtitle {
  margin-top: 32px;

  color:
    rgba(255, 255, 255, 0.92);

  font-size:
    clamp(15px, 3.8vw, 22px);

  letter-spacing:
    0.08em;

  opacity: 0;

  transform:
    translateY(12px);

  animation:
    archiveTextReveal 1.5s ease forwards;

  animation-delay: 2.1s;
}

.archiveDescription {
  margin-top: 18px;

  color:
    rgba(255, 255, 255, 0.55);

  font-family:
    "Times New Roman",
    serif;

  font-size:
    clamp(14px, 3.5vw, 18px);

  line-height: 1.6;

  opacity: 0;

  transform:
    translateY(10px);

  animation:
    archiveTextReveal 1.5s ease forwards;

  animation-delay: 2.7s;
}

.archiveContinue {
  margin-top: 38px;

  padding:
    11px 28px;

  border: none;

  border-radius: 24px;

  background: #2E6B3F;

  color: white;

  font-size: 14px;

  cursor: pointer;

  opacity: 0;

  transform:
    translateY(10px);

  animation:
    archiveTextReveal 1.5s ease forwards;

  animation-delay: 3.4s;

  box-shadow:
    0 0 18px rgba(46, 107, 63, 0.35);
}

@keyframes archiveTextReveal {
  from {
    opacity: 0;

    transform:
      translateY(12px);
  }

  to {
    opacity: 1;

    transform:
      translateY(0);
  }
}

.archiveGallery {
  position: absolute;

  inset: 0;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  padding:
    50px 20px 35px;

  opacity: 0;

  visibility: hidden;

  transform:
    translateY(25px);

  transition:
    opacity 1.3s ease,
    transform 1.3s ease,
    visibility 1.3s ease;

  overflow-y: auto;

  scrollbar-width: none;
}

.archiveGallery::-webkit-scrollbar {
  display: none;
}

.archiveGallery.show {
  opacity: 1;

  visibility: visible;

  transform:
    translateY(0);
}

.archiveCounter {
  margin-bottom: 15px;

  color:
    rgba(111, 175, 120, 0.75);

  font-size: 12px;

  letter-spacing:
    0.18em;
}

.archiveCard {
  width:
    min(720px, 92vw);

  text-align: center;
}

.antiqueFrame {
  position: relative;

  width: 100%;

  padding: 15px;

  border:
    1px solid rgba(170, 145, 95, 0.55);

  background:
    rgba(10, 10, 10, 0.92);

  box-shadow:
    0 0 0 4px #050505,
    0 0 0 5px rgba(170, 145, 95, 0.28),
    0 0 30px rgba(111, 175, 120, 0.08);

  transition:
    box-shadow 0.8s ease;
}

.antiqueFrame::before {
  content: "";

  position: absolute;

  inset: 5px;

  border:
    1px solid rgba(170, 145, 95, 0.28);

  pointer-events: none;
}

.antiqueFrame::after {
  content: "";

  position: absolute;

  inset: 10px;

  border:
    1px solid rgba(255, 255, 255, 0.05);

  pointer-events: none;
}

.photoHolder {
  position: relative;

  width: 100%;

  height:
    min(58vh, 570px);

  display: flex;

  justify-content: center;
  align-items: center;

  overflow: hidden;

  background: #050505;
}

.photoHolder img {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: contain;

  opacity: 0;

  transform:
    scale(0.96);

  transition:
    opacity 0.9s ease,
    transform 0.9s ease;
}

.photoHolder img.show {
  opacity: 1;

  transform:
    scale(1);
}

.frameCorner {
  position: absolute;

  z-index: 5;

  width: 25px;
  height: 25px;

  display: flex;

  align-items: center;
  justify-content: center;

  color:
    rgba(170, 145, 95, 0.75);

  font-size: 13px;

  text-shadow:
    0 0 8px rgba(170, 145, 95, 0.25);
}

.topLeft {
  left: 0;
  top: 0;
}

.topRight {
  right: 0;
  top: 0;
}

.bottomLeft {
  left: 0;
  bottom: 0;
}

.bottomRight {
  right: 0;
  bottom: 0;
}

.archiveCaption {
  width: 100%;

  max-width: 680px;

  margin:
    23px auto 0;

  color:
    rgba(255, 255, 255, 0.88);

  font-family:
    "Times New Roman",
    serif;

  font-size:
    clamp(15px, 3.8vw, 18px);

  line-height: 1.65;

  text-align: center;

  opacity: 0;

  transform:
    translateY(8px);

  transition:
    opacity 0.9s ease,
    transform 0.9s ease;
}

.archiveCaption.show {
  opacity: 1;

  transform:
    translateY(0);
}

.archiveControls {
  height: 60px;

  display: flex;

  align-items: center;
  justify-content: center;
}

.archiveNext {
  margin-top: 18px;

  padding:
    11px 28px;

  border: none;

  border-radius: 24px;

  background: #2E6B3F;

  color: white;

  font-size: 14px;

  cursor: pointer;

  box-shadow:
    0 0 16px rgba(46, 107, 63, 0.30);

  opacity: 0;

  transform:
    translateY(8px);

  transition:
    opacity 0.8s ease,
    transform 0.8s ease;
}

.archiveNext.show {
  opacity: 1;

  transform:
    translateY(0);
}

.archiveEnding {
  position: absolute;

  inset: 0;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding: 30px;

  text-align: center;

  background: #000;

  opacity: 0;

  visibility: hidden;

  transition:
    opacity 1.5s ease,
    visibility 1.5s ease;
}

.archiveEnding.show {
  opacity: 1;

  visibility: visible;
}

.archiveEndingText {
  width:
    min(700px, 88%);

  color:
    rgba(255, 255, 255, 0.9);

  font-family:
    "Times New Roman",
    serif;

  font-size:
    clamp(17px, 4vw, 24px);

  line-height: 1.7;
}

.archiveFinalContinue {
  margin-top: 38px;

  padding:
    11px 28px;

  border: none;

  border-radius: 24px;

  background: #2E6B3F;

  color: white;

  font-size: 14px;

  cursor: pointer;

  box-shadow:
    0 0 16px rgba(46, 107, 63, 0.30);
}

/* =====================================================
   LATER SCREENS
===================================================== */

.laterScreen {
  background: #000;
}

/* =========================
   SCREEN 5 — FINAL REPORT
========================= */

.reportGlow {
  position: absolute;

  width: 600px;
  height: 500px;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  background:
    radial-gradient(
      ellipse,
      rgba(111, 175, 120, 0.13),
      transparent 70%
    );

  filter: blur(20px);
}

.reportContainer {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  width: min(700px, 88%);

  text-align: center;
}

.caseLabel {
  color: #6FAF78;

  font-size:
    clamp(30px, 8vw, 58px);

  letter-spacing:
    0.18em;

  font-weight: 300;
}

.reportLine {
  width: 100%;

  height: 1px;

  margin: 24px 0;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(170, 145, 95, 0.65),
      transparent
    );
}

.reportName {
  font-family:
    "Times New Roman",
    serif;

  font-size:
    clamp(22px, 5vw, 34px);

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

window.addEventListener(
  "resize",
  resizeCanvas
);

const heartPoints = [];

for (
  let t = 0;
  t < Math.PI * 2;
  t += 0.035
) {

  const x =
    16 * Math.pow(
      Math.sin(t),
      3
    );

  const y =
    13 * Math.cos(t)
    - 5 * Math.cos(2 * t)
    - 2 * Math.cos(3 * t)
    - Math.cos(4 * t);

  heartPoints.push({
    x,
    y
  });
}

let heartIndex = 0;

function drawHeart() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const scale =
    Math.min(
      canvas.width,
      canvas.height
    ) * 0.018;

  const centerX =
    canvas.width / 2;

  const centerY =
    canvas.height / 2 - 25;

  for (
    let i = 0;
    i < heartIndex;
    i++

    const point =
      heartPoints[i];

    const x =
      centerX +
      point.x * scale;

    const y =
      centerY -
      point.y * scale;

    ctx.font =
      "bold 14px Arial";

    ctx.textAlign =
      "center";

    ctx.textBaseline =
      "middle";

    ctx.fillStyle =
      "#800020";

    ctx.shadowColor =
      "#FF69B4";

    ctx.shadowBlur =
      10;

    ctx.fillText(
      "Happy Birthday",
      x,
      y

  }

  ctx.shadowBlur = 0;

    heartIndex <
    heartPoints.length

const letterText =

let letterStarted = false;

function prepareLetter() {

  letterText.innerHTML = "";

  letterParagraphs.forEach(
    paragraph => {

      const p =
        document.createElement("p");

      p.className =
        "letterParagraph";

      const words =
        paragraph.split(" ");

      words.forEach(
        (word, index) => {

          const span =
            document.createElement("span");

          span.className =
            "word";

          span.textContent =
            word;

          p.appendChild(
            span
          );

          if (
            index <
            words.length - 1
          ) {

            p.appendChild(
              document.createTextNode(" ")
            );

          }

        }
      );

      letterText.appendChild(
        p
      );

    }
  );
}

prepareLetter();

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}

async function typeLetter() {

  if (letterStarted)
    return;

  letterStarted = true;

  continue3.classList.remove(
    "show"
  );

  const paragraphs =
    letterText.querySelectorAll(
      ".letterParagraph"
    );

  for (
    let p = 0;
    p < paragraphs.length;
    p++
  ) {

    const words =
      paragraphs[p].querySelectorAll(
        ".word"
      );

    for (
      let i = 0;
      i < words.length;
      i++
    ) {

      words[i].classList.add(
        "visible"
      );

      const word =
        words[i].textContent;

      let delay = 390;

      if (
        word.includes("…")
      ) {

        delay = 1000;

      }
      else if (
        /[.!?]$/.test(word)
      ) {

        delay = 650;

      }
      else if (
        /[,;:]$/.test(word)
      ) {

        delay = 520;

      }
      else if (
        /[😭💀❤️🙂🙄😌]/u.test(word)
      ) {

        delay = 550;

      }

      await sleep(delay);

    }

    await sleep(900);

  }

  await sleep(800);

  continue3.classList.add(
    "show"
  );
}

let currentScreen = 1;

function goToScreen(number) {

  if (
    number === currentScreen
  )
    return;

  const oldScreen =
    document.getElementById(
      "screen" + currentScreen
    );

  const newScreen =
    document.getElementById(
      "screen" + number
    );

  if (!oldScreen || !newScreen)
    return;

  oldScreen.classList.remove(
    "active"
  );

  setTimeout(() => {

    newScreen.classList.add(
      "active"
    );

    currentScreen =
      number;

    if (
      number === 3
    ) {

      setTimeout(
        () => {

          typeLetter();

        },
        3600
      );

    }

  }, 900);

}

let audioContext = null;
let birthdayMusicStarted = false;

function getAudioContext() {

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  return audioContext;
}

/* =====================================================
   POP SOUND
===================================================== */

function playPopSound() {

  const audio =
    getAudioContext();

  if (
    audio.state === "suspended"
  ) {

    audio.resume();

  }

  const now =
    audio.currentTime;

  const osc =
    audio.createOscillator();

  const gain =
    audio.createGain();

  osc.type =
    "sawtooth";

  osc.frequency.setValueAtTime(
    180,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    65,
    now + 0.16
  );

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.35,
    now + 0.01
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + 0.18
  );

  osc.connect(gain);

  gain.connect(
    audio.destination
  );

  osc.start(now);

  osc.stop(
    now + 0.2
  );

}

/* =====================================================
   TINY CELEBRATION SOUND
===================================================== */

function playTinyCelebrationSound() {

  const audio =
    getAudioContext();

  const now =
    audio.currentTime;

  const notes = [
    783.99,
    987.77,
    1174.66
  ];

  notes.forEach(
    (frequency, index) => {

      const osc =
        audio.createOscillator();

      const gain =
        audio.createGain();

      osc.type =
        "sine";

      const start =
        now + index * 0.09;

      osc.frequency.value =
        frequency;

      gain.gain.setValueAtTime(
        0.0001,
        start
      );

      gain.gain.exponentialRampToValueAtTime(
        0.08,
        start + 0.015
      );

      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        start + 0.25
      );

      osc.connect(gain);

      gain.connect(
        audio.destination
      );

      osc.start(start);

      osc.stop(
        start + 0.27
      );

    }
  );

}

function startBirthdayMusic() {

  birthdayMusicStarted = true;

  const audio =
    getAudioContext();

  if (
    audio.state === "suspended"
  ) {

    audio.resume();

  }

  const melody = [

    523.25,
    659.25,
    783.99,
    659.25,

    698.46,
    783.99,
    880.00,
    783.99,

    659.25,
    587.33,
    523.25,
    587.33,

    659.25,
    783.99,
    659.25,
    523.25

  ];

  const noteLength =
    0.35;

  function playMelody() {

    if (
      currentScreen !== 9
    )
      return;

    const startTime =
      audio.currentTime + 0.05;

    melody.forEach(
      (frequency, index) => {

        const oscillator =
          audio.createOscillator();

        const gain =
          audio.createGain();

        const start =
          startTime +
          index * noteLength;

        const end =
          start +
          noteLength * 0.82;

        oscillator.type =
          "sine";

        oscillator.frequency.value =
          frequency;

        gain.gain.setValueAtTime(
          0.0001,
          start
        );

        gain.gain.exponentialRampToValueAtTime(
          0.055,
          start + 0.025
        );

        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          end
        );

        oscillator.connect(
          gain
        );

        gain.connect(
          audio.destination
        );

        oscillator.start(
          start
        );

        oscillator.stop(
          end + 0.03
        );

      }
    );

    setTimeout(
      playMelody,
      5600
    );

  }

  playMelody();

}
